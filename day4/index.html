<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture ideas before they disappear.</p>
      <nav>
        <a href="index.html">Home</a>
        <a href="../about.html">About</a>
      </nav>
    </header>

    <main>
      <h2>Welcome to QuickNotes</h2>
      <p>Capture your ideas, tasks, and notes quickly and easily.</p>

      <section>
        <h3>Start a New Note</h3>
        <form>
          <label for="note-text">Your note:</label>
          <textarea id="note-text" name="note" rows="6"></textarea>
        </form>
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
        <button id="clear-btn">Clear</button>
        <button id="theme-toggle">Dark mode</button>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. All rights reserved.</p>
    </footer>
  </body>
</html>
